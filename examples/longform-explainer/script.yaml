  - character: narrator
    line: "映像に音を付けるとき、何を鳴らすかより、どこを空けるかを考えてみてください。"
    emotion: calm
    intensity: moderate
    volume: normal
    speed: natural
    delivery: gentle
    pause_before: 0.8
    seed: 1
    name: n28
  - character: narrator
    line: "最後に一つ。音を足す前に、一度、無音でその場面を見てください。足りないものが、見えます。"
    emotion: calm
