    emotion: calm
    intensity: subtle
    volume: normal
    speed: slow
    delivery: gentle
    pause_before: 2.0
    seed: 1
    name: d03
  - character: narrator
    line: "二つめ。"
    emotion: calm
    intensity: subtle
    volume: normal
    speed: natural
    delivery: controlled
    pause_before: 2.0
    seed: 1
    name: d04
  - character: narrator
    line: "叩きつける音。同じ台詞が、怒りになります。"
    emotion: confidence
    intensity: moderate
    volume: loud
    speed: natural
    delivery: aggressive
    pause_before: 2.0
    seed: 1
    name: d05
  - character: narrator
    line: "三つめ。"
    emotion: calm
    intensity: subtle
    volume: normal
    speed: natural
    delivery: controlled
    pause_before: 2.0
