# 真白（ましろ）— 『午前二時に、あなたは誰の時間を生きていますか』
# （soul-voice-teller/examples/gozen-niji）の主人公・高校二年生。
# voice_profile.schema.json 準拠。reference_audio は参照音声ライブラリの話者キー
# （経路A: timbre をこの音声から、prosody を Direction から合成）。
# 声質は design.md の「声は小さい（2-1）」「内省的・控えめ（2-2）」
# 「本心を言うとき語尾が短くなる（2-13）」から。
character: 真白
reference_audio: mashiro   # 経路Bで生成した真白専用の元音声（references/mashiro.wav）
voice:
  age: adolescent     # 高校二年生（child / adolescent / young_adult / adult / middle_aged / elderly）
  gender: female      # female / male（プロンプト主語と参照ファイル名判定に使う）
  pitch: medium_high  # very_low / low / medium_low / medium / medium_high / high / very_high
  texture: soft       # 内省的・控えめ（soft / warm / clear / bright / dark / husky / breathy / neutral）
  breathiness: slight # 小声・内気（none / slight / moderate / heavy）
  resonance: intimate # 小声・近い距離感（intimate / chest / head / nasal / bright / neutral）
