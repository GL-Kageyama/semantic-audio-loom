# 感情の効きは、seed の揺れを超えるか。
#
# 同じ一行「明日、また来るね。」を、感情だけ 5 通りに振り、それぞれ seed 1〜3 で作る
# （5 感情 × 3 seed = 15 本）。他のノブ（強度・声量・速さ・型）は全部そろえる。
# これで「感情で動く幅」と「seed で動く幅」を同じ物差しで比べられる。
#
# 測るのは emotion-seed/measure_emotion_seed.py。
name: emotion-seed
default_pause: 0.5
cues:
  - {character: mashiro, line: 明日、また来るね。, emotion: neutral, intensity: strong,
     volume: normal, speed: natural, delivery: controlled, seed: 1, pause_before: 0.0, name: neutral-s1}
  - {character: mashiro, line: 明日、また来るね。, emotion: neutral, intensity: strong,
     volume: normal, speed: natural, delivery: controlled, seed: 2, pause_before: 0.0, name: neutral-s2}
  - {character: mashiro, line: 明日、また来るね。, emotion: neutral, intensity: strong,
     volume: normal, speed: natural, delivery: controlled, seed: 3, pause_before: 0.0, name: neutral-s3}
  - {character: mashiro, line: 明日、また来るね。, emotion: joy, intensity: strong,
     volume: normal, speed: natural, delivery: controlled, seed: 1, pause_before: 0.0, name: joy-s1}
  - {character: mashiro, line: 明日、また来るね。, emotion: joy, intensity: strong,
     volume: normal, speed: natural, delivery: controlled, seed: 2, pause_before: 0.0, name: joy-s2}
  - {character: mashiro, line: 明日、また来るね。, emotion: joy, intensity: strong,
     volume: normal, speed: natural, delivery: controlled, seed: 3, pause_before: 0.0, name: joy-s3}
  - {character: mashiro, line: 明日、また来るね。, emotion: anger, intensity: strong,
