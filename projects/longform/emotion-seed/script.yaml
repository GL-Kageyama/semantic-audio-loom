  - {character: mashiro, line: 明日、また来るね。, emotion: anger, intensity: strong,
     volume: normal, speed: natural, delivery: controlled, seed: 2, pause_before: 0.0, name: anger-s2}
  - {character: mashiro, line: 明日、また来るね。, emotion: anger, intensity: strong,
