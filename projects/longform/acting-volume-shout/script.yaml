  - {character: mashiro, line: 明日、また来るね。, emotion: joy, intensity: moderate, volume: shout, speed: natural, delivery: gentle, breathiness: none, seed: 3, name: vs-shout-s3}
  - {character: mashiro, line: 明日、また来るね。, emotion: joy, intensity: moderate, volume: shout, speed: natural, delivery: gentle, breathiness: none, seed: 4, name: vs-shout-s4}
  - {character: mashiro, line: 明日、また来るね。, emotion: joy, intensity: moderate, volume: shout, speed: natural, delivery: gentle, breathiness: none, seed: 5, name: vs-shout-s5}
