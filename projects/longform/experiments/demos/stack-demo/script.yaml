# 聞き比べ：速さを端まで振ると、演技の型の差は聞こえなくなる。
#
# `acting-knob-stack/` の実測（f0 で aggressive − gentle が natural +6.7 Hz・
# very_slow +0.7・very_fast −1.1 Hz）を、耳で確かめるための見本。
# 語り手が札を読み、真白が同じ台詞・同じ seed で 6 回言う。
name: stack-demo
default_pause: 0.0
cues:
- {character: narrator, line: 同じ台詞、同じ声。速さと、演技の型だけを変えます。, emotion: neutral, intensity: moderate, volume: normal, speed: natural, delivery: controlled, breathiness: none, seed: 1, pause_before: 0.2, name: n-intro}
- {character: narrator, line: 速さは、ふつう。, emotion: neutral, intensity: moderate, volume: normal, speed: natural, delivery: controlled, breathiness: none, seed: 1, pause_before: 0.8, name: n-l-nat}
- {character: narrator, line: やさしく, emotion: neutral, intensity: moderate, volume: normal, speed: natural, delivery: controlled, breathiness: none, seed: 1, pause_before: 0.5, name: n-l-nat-gentle}
- {character: mashiro, line: 明日、また来るね。, emotion: joy, intensity: moderate, volume: normal, speed: natural, delivery: gentle, breathiness: none, seed: 1, pause_before: 0.4, name: x-nat-gentle}
- {character: narrator, line: 強く, emotion: neutral, intensity: moderate, volume: normal, speed: natural, delivery: controlled, breathiness: none, seed: 1, pause_before: 0.5, name: n-l-nat-aggressive}
- {character: mashiro, line: 明日、また来るね。, emotion: joy, intensity: moderate, volume: normal, speed: natural, delivery: aggressive, breathiness: none, seed: 1, pause_before: 0.4, name: x-nat-aggressive}
- {character: narrator, line: 速さは、とても遅く。, emotion: neutral, intensity: moderate, volume: normal, speed: natural, delivery: controlled, breathiness: none, seed: 1, pause_before: 0.8, name: n-l-slow}
- {character: narrator, line: やさしく, emotion: neutral, intensity: moderate, volume: normal, speed: natural, delivery: controlled, breathiness: none, seed: 1, pause_before: 0.5, name: n-l-slow-gentle}
- {character: mashiro, line: 明日、また来るね。, emotion: joy, intensity: moderate, volume: normal, speed: very_slow, delivery: gentle, breathiness: none, seed: 1, pause_before: 0.4, name: x-slow-gentle}
- {character: narrator, line: 強く, emotion: neutral, intensity: moderate, volume: normal, speed: natural, delivery: controlled, breathiness: none, seed: 1, pause_before: 0.5, name: n-l-slow-aggressive}
- {character: mashiro, line: 明日、また来るね。, emotion: joy, intensity: moderate, volume: normal, speed: very_slow, delivery: aggressive, breathiness: none, seed: 1, pause_before: 0.4, name: x-slow-aggressive}
- {character: narrator, line: 速さは、とても速く。, emotion: neutral, intensity: moderate, volume: normal, speed: natural, delivery: controlled, breathiness: none, seed: 1, pause_before: 0.8, name: n-l-fast}
- {character: narrator, line: やさしく, emotion: neutral, intensity: moderate, volume: normal, speed: natural, delivery: controlled, breathiness: none, seed: 1, pause_before: 0.5, name: n-l-fast-gentle}
- {character: mashiro, line: 明日、また来るね。, emotion: joy, intensity: moderate, volume: normal, speed: very_fast, delivery: gentle, breathiness: none, seed: 1, pause_before: 0.4, name: x-fast-gentle}
- {character: narrator, line: 強く, emotion: neutral, intensity: moderate, volume: normal, speed: natural, delivery: controlled, breathiness: none, seed: 1, pause_before: 0.5, name: n-l-fast-aggressive}
- {character: mashiro, line: 明日、また来るね。, emotion: joy, intensity: moderate, volume: normal, speed: very_fast, delivery: aggressive, breathiness: none, seed: 1, pause_before: 0.4, name: x-fast-aggressive}
- {character: narrator, line: 速さが端まで振れていると、型の差は、ほどんど聞こえません。, emotion: neutral, intensity: moderate, volume: normal, speed: natural, delivery: controlled, breathiness: none, seed: 1, pause_before: 1.0, name: n-close}
