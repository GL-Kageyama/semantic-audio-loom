- {character: narrator, line: 記号は、どの感情の上でも同じだけ足せます。, emotion: neutral, intensity: moderate, volume: normal, speed: natural, pitch: natural, delivery: controlled, breathiness: none, seed: 4, pause_before: 1.0, name: n-mark}
