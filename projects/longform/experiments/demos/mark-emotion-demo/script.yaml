- {character: narrator, line: 感情を振ると、高さが動きます。, emotion: neutral, intensity: moderate, volume: normal, speed: natural, pitch: natural, delivery: controlled, breathiness: none, seed: 4, pause_before: 1.0, name: n-emotion}
- {character: mashiro, line: 明日、また来るね。, emotion: joy, intensity: moderate, volume: normal, speed: natural, pitch: natural, delivery: controlled, breathiness: none, seed: 2, beta: 0.7, pause_before: 0.4, name: me-joy-period}
