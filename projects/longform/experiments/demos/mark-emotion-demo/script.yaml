# 聞き比べ：感情の上に、記号を足す
#
# `acting-mark-emotion5/`（6 感情 × 2 記号 × seed 3）を耳で確かめる。
# 感情を振る→その上に `！` を足す。seed は 2（3 本の真ん中）。
name: mark-emotion-demo
default_pause: 0.0
cues:
- {character: narrator, line: 同じ一行を、感情と記号で振って聴きます。, emotion: neutral, intensity: moderate, volume: normal, speed: natural, pitch: natural, delivery: controlled, breathiness: none, seed: 4, pause_before: 0.2, name: n-intro}
- {character: mashiro, line: 明日、また来るね。, emotion: neutral, intensity: moderate, volume: normal, speed: natural, pitch: natural, delivery: controlled, breathiness: none, seed: 2, beta: 0.7, pause_before: 0.4, name: me-neutral-period}
