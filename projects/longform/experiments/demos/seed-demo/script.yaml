# 聞き比べ：同じ指示で seed だけを替える（seed の散らばりを見る見本）
#
# `acting-emotion-ladder/` の実測（seed 5 本の幅 64.6〜98.0 Hz）を耳で確かめる。
# 語り手が「一回目」…と読み、真白が同じ台詞・同じ演技を seed 1〜5 で言う。
name: seed-demo
default_pause: 0.0
