  - {character: mashiro, line: 明日、また来るね。, emotion: sadness, intensity: overwhelming, volume: normal, speed: natural, delivery: controlled, breathiness: none, seed: 1, beta: 0.3, alpha: 0.35, name: s03-sadness-overwhelming-s1}
  - {character: mashiro, line: 明日、また来るね。, emotion: sadness, intensity: overwhelming, volume: normal, speed: natural, delivery: controlled, breathiness: none, seed: 2, beta: 0.3, alpha: 0.35, name: s03-sadness-overwhelming-s2}
