# `acting-punctuation-speed/` は真白だけ・seed 1-5。ここでは声を替えて、
# (a) 記号の効きが極端な速さでも残るか、(b) 速さ自身の f0 への効きが
# 声に依らないか、を見る。同じ行・neutral・beta 0.7。

