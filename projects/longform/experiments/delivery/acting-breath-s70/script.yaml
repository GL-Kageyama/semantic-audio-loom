# `breathiness: slight` は、小さなノブか（芝居 s70 の 1 行で）
#
# 出荷版の s70 は breathiness を書く前の台本で作られていた（f0 329.7 Hz）。
# 台本どおり breathiness: slight を足して作り直すと 242.1 Hz になった——**同じ seed・同じ行で。**
# その差が breathiness のせいかを、欄だけを振って確かめる（3 seed × 2 値）。
#
# ビルド: PYTHONPATH=. <venv> projects/longform/explainer/build_voice.py --dir projects/longform/experiments/delivery/acting-breath-s70
name: acting-breath-s70
default_pause: 0.0
cues:
  - {character: mashiro, line: "……ばか。", emotion: sadness, intensity: subtle, volume: quiet, speed: very_slow, delivery: restrained, breathiness: none, seed: 1, name: bs-none-s1}
  - {character: mashiro, line: "……ばか。", emotion: sadness, intensity: subtle, volume: quiet, speed: very_slow, delivery: restrained, breathiness: none, seed: 2, name: bs-none-s2}
  - {character: mashiro, line: "……ばか。", emotion: sadness, intensity: subtle, volume: quiet, speed: very_slow, delivery: restrained, breathiness: none, seed: 3, name: bs-none-s3}
  - {character: mashiro, line: "……ばか。", emotion: sadness, intensity: subtle, volume: quiet, speed: very_slow, delivery: restrained, breathiness: slight, seed: 1, name: bs-slight-s1}
  - {character: mashiro, line: "……ばか。", emotion: sadness, intensity: subtle, volume: quiet, speed: very_slow, delivery: restrained, breathiness: slight, seed: 2, name: bs-slight-s2}
  - {character: mashiro, line: "……ばか。", emotion: sadness, intensity: subtle, volume: quiet, speed: very_slow, delivery: restrained, breathiness: slight, seed: 3, name: bs-slight-s3}
