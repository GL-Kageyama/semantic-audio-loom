# 声量の語は、声を小さくするか
#
# 台本では volume を 88 回書いている（quiet 43・normal 41・whisper 3・loud 2）。
# 作品の測定（drama-level）では quiet と normal の energy が −0.7 dB しか離れず、範囲は重なっていた。
# 行が違うので確かめられない。同じ行・同じ感情・seed 5 本で volume だけを振る。
#
# ビルド:
#   PYTHONPATH=. <venv> projects/longform/explainer/build_voice.py --dir projects/longform/experiments/delivery/acting-volume
