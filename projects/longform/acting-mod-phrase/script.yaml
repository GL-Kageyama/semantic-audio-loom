# 強度の真ん中にも散文を 1 つ置く（moderate だけを 15 本）。
#
# 既定の _INTENSITY_PHRASES は 0.40〜0.70 の帯に文言を持たない。
# つまり moderate（0.5）は「強度のことを何も言わない」＝感情だけの文になる。
# 効き目が 2 段に見えるのは、語が 2 段しか無いからではないか、を直接試す。
#
# ここでは 0.5 に "the feeling is moderately strong" を差し込んで同じ 15 本を作る。
# 比べる相手は acting-matrix の em-<emotion>-s1〜5（同じ設定・文言なし）。
# ビルドは acting/mod_phrase_build.py（tsukasa._INTENSITY_PHRASES を差し替える）。
name: acting-mod-phrase
default_pause: 0.0
cues:
  - {character: mashiro, line: 明日、また来るね。, emotion: anger, intensity: moderate, volume: normal, speed: natural, delivery: controlled, breathiness: none, seed: 1, name: mp-anger-s1}
