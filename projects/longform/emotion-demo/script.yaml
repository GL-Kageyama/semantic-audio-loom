- {character: mashiro, line: 明日、また来るね。, emotion: confidence, intensity: moderate, volume: normal, speed: natural, delivery: controlled, breathiness: none, seed: 4, pause_before: 0.4, name: x-confidence}
- {character: narrator, line: 興奮。, emotion: neutral, intensity: moderate, volume: normal, speed: natural, delivery: controlled, breathiness: none, seed: 4, pause_before: 0.6, name: n-excitement}
